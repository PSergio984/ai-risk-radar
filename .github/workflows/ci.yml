name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Lint & Offline Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run offline test suite
        run: |
          pytest -v -m "not historical_artifacts"

  container-smoke:
    name: Container Build & Fixture Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Cryptographic Evidence Bundle
        run: |
          python3 scripts/verify_evidence_bundle.py

      - name: Build Docker image on clean checkout
        run: |
          docker build -t ai-risk-radar:ci-smoke .

      - name: Run container test suite in Docker
        run: |
          docker run --rm ai-risk-radar:ci-smoke test

      - name: Start fixture dashboard in background
        run: |
          docker run -d --name ai-risk-radar-smoke -p 8501:8501 ai-risk-radar:ci-smoke fixture-dashboard

      - name: Verify Streamlit healthcheck
        run: |
          for i in {1..15}; do
            if curl -s -f http://localhost:8501/_stcore/health; then
              echo "Streamlit healthcheck passed successfully!"
              exit 0
            fi
            echo "Waiting for Streamlit dashboard to be healthy... ($i/15)"
            sleep 2
          done
          echo "Streamlit healthcheck failed!"
          docker logs ai-risk-radar-smoke
          exit 1

      - name: Teardown smoke container
        if: always()
        run: |
          docker stop ai-risk-radar-smoke || true
          docker rm ai-risk-radar-smoke || true
